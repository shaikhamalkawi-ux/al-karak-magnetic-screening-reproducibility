name: Source-free and released-aggregate verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python run_checks.py
      - run: python code/verify_source_free.py --root derived
      - run: python code/replay_reported_aggregates.py --root derived
      - run: sha256sum -c derived/SHA256SUMS.txt
